# =============================================================================
# dpp.vim Plugin Configuration (Lazy Load)
# =============================================================================
# Plugins in this file are loaded on-demand based on filetype or events

# =============================================================================
# Swift
# =============================================================================

[[plugins]]
repo = 'toyamarinyon/vim-swift'
on_ft = 'swift'

# =============================================================================
# TOML
# =============================================================================

[[plugins]]
repo = 'cespare/vim-toml'
on_ft = 'toml'

# =============================================================================
# Rust
# =============================================================================

[[plugins]]
repo = 'rust-lang/rust.vim'
on_ft = 'rust'
