# =============================================================================
# dpp.vim Plugin Configuration (Immediate Load)
# =============================================================================

# =============================================================================
# File Explorer
# =============================================================================

# File icons for various plugins
[[plugins]]
repo = 'ryanoasis/vim-devicons'
merged = false

# File tree explorer
[[plugins]]
repo = 'scrooloose/nerdtree'
merged = false

# =============================================================================
# Color Scheme
# =============================================================================

[[plugins]]
repo = 'wadackel/vim-dogrun'

# =============================================================================
# Fuzzy Finder
# =============================================================================

# fzf binary
[[plugins]]
repo = 'junegunn/fzf'
merged = false
[plugins.extAttrs.installer]
build = './install --bin'

# fzf vim integration
[[plugins]]
repo = 'junegunn/fzf.vim'
depends = ['fzf']

# =============================================================================
# Development Tools
# =============================================================================

# LSP symbols viewer (tagbar replacement)
[[plugins]]
repo = 'liuchengxu/vista.vim'

# Git integration
[[plugins]]
repo = 'tpope/vim-fugitive'

# =============================================================================
# LSP (Language Server Protocol)
# =============================================================================

# Async library for vim-lsp
[[plugins]]
repo = 'prabirshrestha/async.vim'

# LSP client
[[plugins]]
repo = 'prabirshrestha/vim-lsp'

# Auto-install LSP servers
[[plugins]]
repo = 'mattn/vim-lsp-settings'

# Async completion framework
[[plugins]]
repo = 'prabirshrestha/asyncomplete.vim'

# LSP source for asyncomplete
[[plugins]]
repo = 'prabirshrestha/asyncomplete-lsp.vim'

# =============================================================================
# Language Support (Immediate Load)
# =============================================================================

# Go
[[plugins]]
repo = 'fatih/vim-go'

# TypeScript (syntax)
[[plugins]]
repo = 'leafgarland/typescript-vim'

# Haskell (syntax)
[[plugins]]
repo = 'neovimhaskell/haskell-vim'

# Kotlin (syntax)
[[plugins]]
repo = 'udalov/kotlin-vim'

# Dart (syntax + tools)
[[plugins]]
repo = 'dart-lang/dart-vim-plugin'
